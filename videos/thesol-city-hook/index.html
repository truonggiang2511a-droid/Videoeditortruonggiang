<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; font-family: Inter, sans-serif; }
      .layer { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
      video.layer { object-fit: cover; }
      /* soft sky darkening so white type holds contrast on the bright sky */
      #shade {
        z-index: 2; pointer-events: none;
        background: linear-gradient(180deg, rgba(4,12,28,0) 18%, rgba(4,12,28,0.38) 32%, rgba(4,12,28,0.38) 52%, rgba(4,12,28,0) 64%);
      }
      #title { z-index: 3; display: flex; flex-direction: column; align-items: center; }
      .ln { position: absolute; left: 0; width: 1080px; text-align: center; white-space: nowrap; line-height: 1; }
      #l1 {
        top: 520px; font-size: 136px; font-weight: 900; letter-spacing: -0.02em; color: #fff;
        text-shadow: 0 6px 28px rgba(0,0,0,0.45);
      }
      #l1 span {
        display: inline-block; padding: 14px 40px 22px; background: #E3161B; border-radius: 10px;
        box-shadow: 0 12px 40px rgba(0,0,0,0.35);
      }
      #l2 {
        top: 690px; font-size: 250px; font-weight: 900; letter-spacing: -0.04em;
        color: #FFD23F;
        text-shadow: 0 4px 0 #B8860B, 0 14px 40px rgba(0,0,0,0.55);
      }
      #l3 {
        top: 935px; font-size: 104px; font-weight: 900; letter-spacing: 0.06em; color: #fff;
        text-shadow: 0 6px 30px rgba(0,0,0,0.5);
      }
      #cutout { z-index: 4; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="18.2" data-width="1080" data-height="1920">
      <video id="base" class="clip layer" src="assets/source.mp4" data-start="0" data-media-start="0" data-duration="18.2" data-track-index="0" data-has-audio="true" playsinline></video>

      <div id="shade" class="clip layer" data-start="0" data-duration="4.9" data-track-index="1"></div>

      <div id="title" class="clip layer" data-start="0" data-duration="4.9" data-track-index="2">
        <div class="ln" id="l1"><span id="l1in">RẺ NHẤT</span></div>
        <div class="ln" id="l2">2.08T</div>
        <div class="ln" id="l3">THESOL CITY</div>
      </div>

      <div id="cutout" class="layer">
        <video id="subject" class="clip layer" src="assets/subject.webm" data-start="0" data-media-start="0" data-duration="4.9" data-track-index="3" muted playsinline></video>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      // entrances, staggered on the opening beat
      tl.fromTo("#shade", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 0);
      tl.fromTo("#l1in", { y: 60, opacity: 0, scale: 0.9 }, { y: 0, opacity: 1, scale: 1, duration: 0.5, ease: "power3.out" }, 0.1);
      tl.fromTo("#l2", { scale: 1.35, opacity: 0, filter: "blur(12px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.6, ease: "power4.out" }, 0.35);
      tl.fromTo("#l3", { opacity: 0, scaleX: 1.3, y: 20 }, { opacity: 1, scaleX: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.65);
      // one emphasis beat on the price while holding
      tl.to("#l2", { scale: 1.05, duration: 0.25, ease: "power2.out" }, 1.6);
      tl.to("#l2", { scale: 1, duration: 0.35, ease: "power2.inOut" }, 1.85);
      // exit before the cutout ends so the plain footage takes over cleanly
      tl.to(["#l1", "#l2", "#l3"], { y: -50, opacity: 0, duration: 0.45, ease: "power2.in", stagger: 0.06 }, 4.2);
      tl.to("#shade", { opacity: 0, duration: 0.5, ease: "power2.in" }, 4.25);
      tl.set("#cutout", { opacity: 0 }, 4.85);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
